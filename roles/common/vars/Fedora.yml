# Fedora: RHEL family with its own repository names.
__devbox_pkg_backend: dnf
# bubblewrap: the sandbox Claude Code and Codex use for the commands they run.
__devbox_base_packages: [nftables, sudo, /usr/bin/curl, ca-certificates, openssl, tar, unzip, python3, git, bubblewrap, procps-ng, tcpdump, acl, systemd-pam]
__devbox_system_ca_bundle: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
__devbox_ssh_service: sshd
__devbox_pkg_dnf_repos: [fedora, updates]
# System libraries the agent CLIs need (installed as root before their installers).
__devbox_cli_packages:
  hermes: [libatomic]
