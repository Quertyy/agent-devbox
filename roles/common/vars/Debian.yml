# Debian, Ubuntu and derivatives.
__devbox_pkg_backend: apt
# bubblewrap: the sandbox Claude Code and Codex use for the commands they run.
__devbox_base_packages: [nftables, sudo, curl, ca-certificates, openssl, tar, unzip, python3, git, bubblewrap, procps, tcpdump, acl, libpam-systemd]
__devbox_system_ca_bundle: /etc/ssl/certs/ca-certificates.crt
__devbox_ssh_service: ssh
# System libraries the agent CLIs need (installed as root before their installers).
__devbox_cli_packages:
  hermes: [libatomic1]
