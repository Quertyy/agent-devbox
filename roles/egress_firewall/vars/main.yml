# Direct (non-proxied) egress presets for the agent, used as
#   devbox_agent_direct_egress: [{ preset: <name> }]
egress_firewall_presets:
  cloudflare_tunnel:
    name: cloudflare-tunnel   # cloudflared (e.g. T3 Code's T3 Connect): region1/region2.v2.argotunnel.com
    proto: both
    ports: [7844]
    cidrs: ["198.41.192.0/24", "198.41.200.0/24", "2606:4700:a0::/48", "2606:4700:a8::/48"]
